
name: Deploy Discord Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
            set -e

            cd /root/my_files/ego_parser_bot_deploy

            echo "Pulling latest code..."
            git pull --ff-only origin main

            echo "Preparing virtual environment..."
            if [ ! -x .venv/bin/python ]; then
              python3.12 -m venv .venv
            fi

            echo "Installing dependencies..."
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt

            echo "Restarting Discord bot..."
            systemctl daemon-reload
            systemctl enable ego-parser-bot
            systemctl restart ego-parser-bot

            sleep 2
            systemctl is-active --quiet ego-parser-bot

            echo "Deployment successful!"
          REMOTE
