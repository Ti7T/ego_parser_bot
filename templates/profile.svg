<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="620" viewBox="0 0 1000 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18191d" />
      <stop offset="100%" stop-color="#101114" />
    </linearGradient>
    <clipPath id="avatarClip">
      <rect x="40" y="40" width="120" height="120" rx="20" />
    </clipPath>
    <!-- clipPath для аватарок тиммейтов (относительно bounding box) -->
    <clipPath id="teammateClip" clipPathUnits="objectBoundingBox">
      <rect x="0" y="0" width="1" height="1" rx="0.167" /> <!-- 6/36 ≈ 0.167 -->
    </clipPath>
  </defs>

  <rect x="10" y="10" width="980" height="600" rx="24" fill="url(#bg)" stroke="#2d2d2d" />
  <rect x="40" y="40" width="120" height="120" rx="20" fill="#333"/>
  <image 
    x="40" y="40" width="120" height="120" 
    href="{{ avatar_url }}" xlink:href="{{ avatar_url }}"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#avatarClip)"
  />
  <rect x="40" y="40" width="120" height="120" rx="20" fill="none" stroke="#ff4d57" style="stroke-width:2px"/>

  <!-- avatar: x=40, width=120, отступ до ника = 30 -->
  {% set nick_x = 40 + 120 + 30 %}   {# = 190, но можно оставить фиксированным #}
  {% set rank_x = nick_x + nick_width + 20 %}   {# отступ после ника #}
  {% set points_x = nick_x %} {# точки на отдельной строке #}
  {% set label_x = points_x + points_width + 15 %} {# текст "POINTS" после цифр #}

  <text x="{{ nick_x }}" y="80" fill="white" font-size="42" font-weight="700" font-family="Segoe UI">{{ nick }}</text>
  <text x="{{ rank_x }}" y="80" fill="#ff4d57" font-size="24" font-family="Segoe UI">#{{ rank }}</text>
  <text x="{{ points_x }}" y="120" fill="#ff4d57" font-size="30" font-family="Segoe UI">{{ points }}</text>
  <text x="{{ label_x }}" y="120" fill="#999" font-size="24" font-family="Segoe UI">POINTS</text>

  <!-- Категории – сетка 2×4 (максимум) -->
  {% for cat in categories %}
    {% set idx = loop.index0 %}
    {% set col = idx % 4 %}
    {% set row = idx // 4 %}
    {% set x = 40 + col * 230 %}
    {% set y = 200 + row * 150 %}
    <rect x="{{ x }}" y="{{ y }}" width="210" height="120" rx="16" fill="#16181c" stroke="#2d2d2d" />
    <text x="{{ x + 18 }}" y="{{ y + 30 }}" fill="white" font-size="22" font-family="Segoe UI">{{ cat.name }}</text>
    <rect x="{{ x + 18 }}" y="{{ y + 50 }}" width="180" height="10" rx="5" fill="#30323a" />
    <rect x="{{ x + 18 }}" y="{{ y + 50 }}" width="{{ cat.percent * 180 / 100 }}" height="10" rx="5" fill="#ff4d57" />
    <text x="{{ x + 18 }}" y="{{ y + 85 }}" fill="#ddd" font-size="18">{{ cat.percent }}%</text>
    <text x="{{ x + 18 }}" y="{{ y + 108 }}" fill="#999" font-size="16">{{ cat.completed }}/{{ cat.total }}</text>
  {% endfor %}

  <line x1="40" y1="500" x2="960" y2="500" stroke="#2d2d2d" />
  <text x="40" y="535" fill="white" font-size="24">Best teammates</text>

  <!-- Тиммейты – только первые 5, с аватарками квадратными со скруглением -->
  {% for tm in teammates[:5] %}
    {% set cx = 60 + loop.index0 * 180 %}
    {% set cy = 570 %}
    {% set size = 36 %}
    {% set offset = size // 2 %}
    <g>
      <!-- фон -->
      <rect x="{{ cx - offset }}" y="{{ cy - offset }}" width="{{ size }}" height="{{ size }}" rx="6" fill="#333" />
      <!-- сама аватарка -->
      <image x="{{ cx - offset }}" y="{{ cy - offset }}" width="{{ size }}" height="{{ size }}"
             href="{{ tm.avatar_url }}" xlink:href="{{ tm.avatar_url }}"
             preserveAspectRatio="xMidYMid slice"
             clip-path="url(#teammateClip)" />
      <!-- обводка (как у основной) -->
      <rect x="{{ cx - offset }}" y="{{ cy - offset }}" width="{{ size }}" height="{{ size }}" rx="6"
            fill="none" stroke="#ff4d57" stroke-width="2" />
    </g>
    <!-- имя и количество карт -->
    <text x="{{ cx + offset + 10 }}" y="{{ cy - 4 }}" fill="white" font-size="20">{{ tm.name }}</text>
    <text x="{{ cx + offset + 10 }}" y="{{ cy + 18 }}" fill="#999" font-size="14">{{ tm.maps }} maps</text>
  {% endfor %}
</svg>